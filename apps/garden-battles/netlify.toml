[[redirects]]
  from = "/api/nftree-listings"
  to = "/.netlify/functions/nftree-listings"
  status = 200

[[redirects]]
  from = "/api/nftree-sale-pools"
  to = "/.netlify/functions/nftree-sale-pools"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[build]
  command = "npx vite build"
  publish = "dist/public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  
[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
